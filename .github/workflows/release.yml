name: Release Dispatcher

on:
  workflow_call:
    inputs:
      runner:
        description: Runner type (e.g., ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      dry-run:
        description: Run in dry-run mode (preview only)
        type: boolean
        default: false
      auto-merge:
        description: Auto-merge strategy for pull requests (e.g., "squash", "merge", "rebase")
        type: string
        required: false
        default: ""
      skip-claude-review:
        description: Skip Claude Code review for this run
        type: boolean
        default: false
      claude-debug:
        description: Enable debug logging for Claude Code review
        type: boolean
        default: false
      claude-review-allowed-bots:
        description: Comma-separated list of bot names allowed to trigger review, or "*" for all
        type: string
        default: "*"
      on-build:
        description: Optional command run after the validation build; a non-zero exit fails the phase. Purely a gate -- it must not mutate the repository, and this job's access scope is unchanged whether it is set or not.
        type: string
        required: false
        default: ""
      fork-review-environment:
        description: >-
          Name of a GitHub Environment that has at least one required reviewer.
          When set, a pull_request_target run from a fork waits on that
          environment's approval and then runs the full validation (check runs,
          Claude review) with this repository's secrets. Empty disables the
          gated leg. The environment must be created by hand with a required
          reviewer; the fork-approval job refuses to continue if it is missing
          or unprotected, because GitHub silently creates an unprotected
          environment the first time a workflow names one. Use only with
          GitHub-hosted runners: a fork run on a self-hosted runner is a
          persistent compromise of that runner.
        type: string
        required: false
        default: ""
    secrets:
      # Optional so a pull_request run from a fork -- which GitHub never hands
      # repository secrets -- is not rejected before its first step. Branch
      # management and publishing still need both; they only run on pushes to
      # main, where the secrets are always present. Validation degrades without
      # them: it checks out with GITHUB_TOKEN and reports through the job
      # status instead of per-check runs.
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CLAUDE_REVIEW_PAT:
        required: false
      CUSTOM_REGISTRIES:
        description: |
          Custom registry authentication (one per line).
          Format: https://registry.example.com/_authToken=TOKEN
        required: false
      NPM_TOKEN:
        description: |
          NPM access token for publishing to npmjs.org.
          Required for first-time publishes or when OIDC isn't configured.
        required: false

jobs:
  control:
    name: Detect Phase
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      phase: ${{ steps.control.outputs.phase }}
      should_continue: ${{ steps.control.outputs.should_continue }}
      has_changesets: ${{ steps.control.outputs.has_changesets }}
      is_release_commit: ${{ steps.control.outputs.is_release_commit }}
      merged_pr_number: ${{ steps.control.outputs.merged_pr_number }}
      is_pr_event: ${{ steps.context.outputs.is_pr_event }}
      is_pr_merged: ${{ steps.context.outputs.is_pr_merged }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect workflow phase
        id: control
        uses: savvy-web/silk-router-action@dev
      - name: Set context flags
        id: context
        run: |
          echo "is_pr_event=${{ github.event_name == 'pull_request' }}" >> $GITHUB_OUTPUT
          echo "is_pr_merged=${{ github.event.pull_request.merged == true }}" >> $GITHUB_OUTPUT

  branch-management:
    name: Branch Management
    needs: control
    # Every phase job excludes pull_request_target. On that event github.ref is
    # the BASE branch, so the router reads a fork PR as "on main, not a push"
    # and answers branch-management; only the fork-* jobs below may run there.
    if: github.event_name != 'pull_request_target' && needs.control.outputs.phase == 'branch-management' && github.event.action != 'closed'
    uses: spencerbeggs/.github/.github/workflows/release-branch.yml@dev
    with:
      dry-run: ${{ inputs.dry-run }}
      runner: ${{ inputs.runner }}
      auto-merge: ${{ inputs.auto-merge }}
    secrets: inherit

  validation:
    name: Validation
    needs: control
    # One validation per pull request. A newer run in the same group cancels the
    # older one; the group must NOT match the caller's workflow-level group, or
    # the two cancel each other (see GitHub's reusable-workflow concurrency note).
    concurrency:
      group: silk-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request_target' && needs.control.outputs.is_pr_event == 'true' && github.event.action != 'closed'
    uses: spencerbeggs/.github/.github/workflows/release-validate.yml@dev
    with:
      phase: ${{ needs.control.outputs.phase }}
      dry-run: ${{ inputs.dry-run }}
      auto-merge: ${{ inputs.auto-merge }}
      claude-debug: ${{ inputs.claude-debug }}
      skip-claude-review: ${{ inputs.skip-claude-review }}
      claude-review-allowed-bots: ${{ inputs.claude-review-allowed-bots }}
      sbom-config: ${{ vars.SILK_RELEASE_SBOM_TEMPLATE }}
      on-build: ${{ inputs.on-build }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  publish:
    name: Publish
    needs: control
    if: github.event_name != 'pull_request_target' && (needs.control.outputs.phase == 'publishing' || needs.control.outputs.phase == 'close-issues') && github.event.action != 'closed'
    uses: spencerbeggs/.github/.github/workflows/release-publish.yml@dev
    with:
      phase: ${{ needs.control.outputs.phase }}
      dry-run: ${{ inputs.dry-run }}
      sbom-config: ${{ vars.SILK_RELEASE_SBOM_TEMPLATE }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Fork pull requests. A pull_request run from a fork carries no secrets, so
  # the validation job above degrades to a job-status result. This leg runs on
  # pull_request_target -- base-repository context, secrets present -- and is
  # parked behind an environment with required reviewers: nothing below
  # fork-approval executes until a maintainer has read the diff and approved
  # the run. Each push is a new run and needs a new approval.
  # ---------------------------------------------------------------------------
  fork-approval:
    name: Fork Approval
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      inputs.fork-review-environment != '' &&
      github.event.action != 'closed'
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.fork-review-environment }}
    permissions:
      contents: read
    steps:
      # GitHub creates an environment with no protection rules the first time
      # a workflow references it. If that happened here, this job would have
      # started without anyone approving -- so refuse to hand off unless a
      # required-reviewers rule is really in place.
      - name: Verify the environment requires reviewers
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.fork-review-environment }}
        run: |
          set -euo pipefail
          RULES=$(gh api "repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT}" --jq '[.protection_rules[]?.type] | join(",")')
          echo "Protection rules on '${ENVIRONMENT}': ${RULES:-<none>}"
          case ",${RULES}," in
            *,required_reviewers,*)
              echo "Environment '${ENVIRONMENT}' requires reviewers; this run was approved."
              ;;
            *)
              echo "::error::Environment '${ENVIRONMENT}' has no required-reviewers rule. Add at least one required reviewer in Settings > Environments before fork pull requests may run with secrets."
              exit 1
              ;;
          esac

  fork-validation:
    name: Fork Validation
    needs: fork-approval
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      inputs.fork-review-environment != '' &&
      github.event.action != 'closed'
    concurrency:
      group: silk-fork-validation-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: spencerbeggs/.github/.github/workflows/release-validate.yml@dev
    with:
      phase: none
      fork: true
      dry-run: ${{ inputs.dry-run }}
      auto-merge: ${{ inputs.auto-merge }}
      claude-debug: ${{ inputs.claude-debug }}
      skip-claude-review: ${{ inputs.skip-claude-review }}
      claude-review-allowed-bots: ${{ inputs.claude-review-allowed-bots }}
      sbom-config: ${{ vars.SILK_RELEASE_SBOM_TEMPLATE }}
      on-build: ${{ inputs.on-build }}
      runner: ${{ inputs.runner }}
    # Explicit, not inherit: the job runs the contributor's install and test
    # code, and everything inherited is reachable from there. Only what the
    # check runs and the review need crosses this line.
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_REVIEW_PAT: ${{ secrets.CLAUDE_REVIEW_PAT }}
