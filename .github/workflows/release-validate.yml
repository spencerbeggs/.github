name: PR Validation

on:
  workflow_call:
    inputs:
      runner:
        description: Runner type (e.g., ubuntu-latest)
        type: string
        required: false
        default: ubuntu-latest
      phase:
        description: The detected workflow phase
        type: string
        required: true
      dry-run:
        description: Run in dry-run mode
        type: boolean
        default: false
      auto-merge:
        description: Auto-merge strategy for pull requests (e.g., "squash", "merge", "rebase")
        type: string
        required: false
        default: ""
      skip-claude-review:
        description: Skip Claude Code review for this run
        type: boolean
        default: false
      claude-debug:
        description: Enable debug logging for Claude Code review
        type: boolean
        default: false
      claude-review-allowed-bots:
        description: Comma-separated list of bot names allowed to trigger review, or "*" for all
        type: string
        default: "*"
      claude-review-plugin-marketplaces:
        description: Newline-separated Claude Code plugin marketplace git URLs to install before review. Empty string disables.
        type: string
        default: "https://github.com/spencerbeggs/bot.git"
      claude-review-plugins:
        description: Newline-separated Claude Code plugins (name@marketplace) to install before review. Empty string disables.
        type: string
        default: "design-docs@spencerbeggs"
      sbom-config:
        description: SBOM metadata configuration (JSON) for NTIA-compliant SBOM generation
        type: string
        required: false
        default: ""
      on-build:
        description: Optional command run after the validation build; a non-zero exit fails the phase. Purely a gate -- it must not mutate the repository, and this job's access scope is unchanged whether it is set or not.
        type: string
        required: false
        default: ""
    secrets:
      APP_PRIVATE_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CLAUDE_REVIEW_PAT:
        required: false
      CUSTOM_REGISTRIES:
        description: |
          Custom registry authentication (one per line).
          Format: https://registry.example.com/_authToken=TOKEN
        required: false

jobs:
  pre-publish:
    name: Pre-Publish Validation
    runs-on: ${{ inputs.runner }}
    if: inputs.phase == 'validation'
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      TURBO_RUN_SUMMARY: "1"
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup runtime
        id: runtime
        uses: savvy-web/silk-runtime-action@dev
        with:
          turbo-s3-bucket: ${{ secrets.TURBO_S3_BUCKET }}
          turbo-s3-region: ${{ secrets.TURBO_S3_REGION }}
          turbo-s3-endpoint: ${{ secrets.TURBO_S3_ENDPOINT }}
          turbo-s3-access-key-id: ${{ secrets.TURBO_S3_ACCESS_KEY_ID }}
          turbo-s3-secret-access-key: ${{ secrets.TURBO_S3_SECRET_ACCESS_KEY }}

      - name: Pre-publish validation
        uses: savvy-web/silk-release-action@dev
        with:
          phase: validation
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          dry-run: ${{ inputs.dry-run }}
          auto-merge: ${{ inputs.auto-merge }}
          release-branch: changeset-release/main
          custom-registries: ${{ secrets.CUSTOM_REGISTRIES }}
          sbom-config: ${{ inputs.sbom-config }}
          on-build: ${{ inputs.on-build }}

  validate:
    name: Code Validation
    runs-on: ${{ inputs.runner }}
    env:
      TURBO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      TURBO_RUN_SUMMARY: "1"
      CHECK_RUN_ID: ""
      CLAUDE_COMMENT_ID: "0"
    permissions:
      contents: read
      checks: write
      id-token: write

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
          permission-checks: write

      - name: Wait for token propagation
        run: sleep 5

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          submodules: true

      # Fail-fast: if check creation fails (GitHub flakiness), the job stops here.
      # The later "Update * Check" steps are gated on this step's success so they
      # never run against check IDs that were never created; the cleanup job
      # resolves any partially-created checks as neutral.
      - name: Create validation checks
        id: create-checks
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const checks = [
              { name: 'PR Title Validation', env_key: 'PR_TITLE_CHECK_ID' },
              { name: 'Conventional Commits', env_key: 'COMMITLINT_CHECK_ID' },
              { name: 'Code Quality', env_key: 'LINT_CHECK_ID' },
              { name: 'Markdown', env_key: 'MARKDOWNLINT_CHECK_ID' },
              { name: 'Tests', env_key: 'TEST_CHECK_ID' },
              { name: 'Shell Tests', env_key: 'BATS_CHECK_ID' }
            ];
            for (const check of checks) {
              const { data } = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.payload.pull_request.head.sha,
                name: check.name,
                status: 'in_progress'
              });
              core.exportVariable(check.env_key, data.id);
            }

      # Decide early whether the Claude review will run. The skip decision only
      # depends on the PR itself — not on validation results — so a skippable
      # review has its check completed as success seconds into the job instead
      # of after the whole test run. The review itself runs as the trailing
      # steps of this job (reusing this runner, token and checkout) and is
      # skipped entirely when should-skip is true.
      - name: Check if Claude is configured
        id: check-config
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "Claude Code OAuth token not configured - review will be skipped"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR only contains version/changelog changes
        if: steps.check-config.outputs.configured == 'true' && inputs.skip-claude-review != true
        id: check-changes
        run: |
          HEAD_REF="${{ github.head_ref }}"
          case "$HEAD_REF" in
            pnpm/config-deps | copilot/* | dependabot/* | changeset-release/*)
              echo "skip-review=true" >> $GITHUB_OUTPUT
              echo "skip-reason=Branch $HEAD_REF is an automated update (covered by preflight reviews)" >> $GITHUB_OUTPUT
              echo "Skipping Claude review - branch '$HEAD_REF' is an automated update (covered by preflight reviews)"
              exit 0
              ;;
          esac

          # A repo that uses changesets tells us directly whether this PR carries
          # release-worthy work: no changeset files means nothing to review. A repo
          # with no .changeset directory is not using changesets at all, so its
          # absence is not a signal - fall through to the file-based checks below.
          if [ -d .changeset ]; then
            CHANGESET_COUNT=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
            if [ "$CHANGESET_COUNT" -eq 0 ]; then
              echo "skip-review=true" >> $GITHUB_OUTPUT
              echo "skip-reason=No changesets present in .changeset/ - nothing release-worthy to review" >> $GITHUB_OUTPUT
              echo "Skipping Claude review - no changesets present in .changeset/"
              exit 0
            fi
            echo "Found $CHANGESET_COUNT changeset(s) in .changeset/ - review is warranted"
          else
            echo "No .changeset directory - changeset presence is not a signal in this repo"
          fi

          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES_WITH_STATUS=$(git diff --name-status origin/${{ github.base_ref }}...HEAD)
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          echo "::group::Changed files"
          echo "$CHANGED_FILES"
          echo "::endgroup::"

          SKIP_REVIEW=true

          for file in $CHANGED_FILES; do
            if [[ "$file" == "CHANGELOG.md" || "$file" == *"/CHANGELOG.md" ]]; then
              continue
            elif [[ "$file" == ".changeset/"*.md ]]; then
              if echo "$CHANGED_FILES_WITH_STATUS" | grep -E "^D[[:space:]]+$(echo "$file" | sed 's/[[\.*^$()+?{|]/\\&/g')$" > /dev/null; then
                continue
              else
                SKIP_REVIEW=false
                break
              fi
            elif [[ "$file" == "package.json" || "$file" == *"/package.json" ]]; then
              DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- "$file")
              NON_VERSION_CHANGES=$(echo "$DIFF" | grep -E '^\+|^-' | grep -v '^+++\|^---' | grep -v '"version":' || true)
              if [ -z "$NON_VERSION_CHANGES" ]; then
                continue
              else
                SKIP_REVIEW=false
                break
              fi
            else
              SKIP_REVIEW=false
              break
            fi
          done

          echo "skip-review=$SKIP_REVIEW" >> $GITHUB_OUTPUT

          if [ "$SKIP_REVIEW" = "true" ]; then
            echo "skip-reason=PR only contains version bumps, changelog updates, and/or deleted changeset files" >> $GITHUB_OUTPUT
            echo "Skipping Claude review - PR only contains version bumps, changelog updates, and/or deleted changeset files"
          else
            echo "Running Claude review - PR contains substantive changes"
          fi

      - name: Create Claude Review check
        id: create-check
        uses: actions/github-script@v9
        env:
          SKIP_REASON: ${{ steps.check-changes.outputs.skip-reason }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // Only review PRs from human users, the configured bot, or copilot
            // (other bots like dependabot/renovate get an immediate skip).
            const actor = context.payload.pull_request.user.login;
            const actorType = context.payload.pull_request.user.type;
            const allowedActor = actor === '${{ vars.APP_BOT_NAME }}' || actor === 'copilot[bot]' || actorType === 'User';
            const isConfigured = '${{ steps.check-config.outputs.configured }}' === 'true';
            const skipInput = '${{ inputs.skip-claude-review }}' === 'true';
            const skipChanges = '${{ steps.check-changes.outputs.skip-review }}' === 'true';
            const shouldSkip = !allowedActor || !isConfigured || skipInput || skipChanges;

            let skipReason = '';
            if (!allowedActor) skipReason = `Automated PR from ${actor} - review not required`;
            else if (!isConfigured) skipReason = 'Claude Code OAuth token not configured';
            else if (skipInput) skipReason = 'Review skipped via workflow input';
            else if (skipChanges) skipReason = process.env.SKIP_REASON || 'PR only contains version bumps, changelog updates, and/or deleted changeset files';

            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Claude Code Review',
              head_sha: context.payload.pull_request.head.sha,
              status: shouldSkip ? 'completed' : 'queued',
              output: {
                title: shouldSkip ? 'Review skipped' : 'Waiting for validation...',
                summary: shouldSkip ? skipReason : 'Claude Code Review is waiting for validation checks to complete.'
              }
            };

            if (shouldSkip) {
              params.conclusion = 'success';
            }

            const { data: checkRun } = await github.rest.checks.create(params);
            core.exportVariable('CHECK_RUN_ID', checkRun.id);
            core.setOutput('should-skip', shouldSkip);
            console.log(`Created check run ${checkRun.id}, shouldSkip: ${shouldSkip}`);

      - name: Setup runtime
        id: runtime
        uses: savvy-web/silk-runtime-action@dev
        with:
          turbo-s3-bucket: ${{ secrets.TURBO_S3_BUCKET }}
          turbo-s3-region: ${{ secrets.TURBO_S3_REGION }}
          turbo-s3-endpoint: ${{ secrets.TURBO_S3_ENDPOINT }}
          turbo-s3-access-key-id: ${{ secrets.TURBO_S3_ACCESS_KEY_ID }}
          turbo-s3-secret-access-key: ${{ secrets.TURBO_S3_SECRET_ACCESS_KEY }}

      - name: Detect package manager
        id: pm
        run: |
          PM=$(jq -r '.devEngines.packageManager.name // "npm"' package.json)
          echo "name=$PM" >> $GITHUB_OUTPUT
          case "$PM" in
            bun) echo "exec=bun x" >> $GITHUB_OUTPUT ;;
            pnpm) echo "exec=pnpm exec" >> $GITHUB_OUTPUT ;;
            yarn) echo "exec=yarn exec" >> $GITHUB_OUTPUT ;;
            *) echo "exec=npx --no" >> $GITHUB_OUTPUT ;;
          esac

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Validate PR Title
        id: pr-title
        continue-on-error: true
        env:
          COMMITLINT_SKIP_DCO: "true"
        run: |
          set +e
          ${{ steps.pm.outputs.exec }} commitlint --config lib/configs/commitlint.config.ts <<< "${{ github.event.pull_request.title }}"
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Update PR Title Check
        if: always() && steps.create-checks.outcome == 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const ok = '${{ steps.pr-title.outputs.exit_code }}' === '0';
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo,
              check_run_id: process.env.PR_TITLE_CHECK_ID,
              status: 'completed', conclusion: ok ? 'success' : 'failure',
              output: { title: ok ? 'Valid' : 'Invalid', summary: ok ? 'PR title follows conventional format' : 'PR title must follow conventional format' }
            });

      - name: Validate Commits
        id: commitlint
        continue-on-error: true
        run: |
          set +e
          ${{ steps.pm.outputs.exec }} commitlint --from=origin/${{ github.base_ref }} --to=HEAD --config lib/configs/commitlint.config.ts
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Update Commitlint Check
        if: always() && steps.create-checks.outcome == 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const ok = '${{ steps.commitlint.outputs.exit_code }}' === '0';
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo,
              check_run_id: process.env.COMMITLINT_CHECK_ID,
              status: 'completed', conclusion: ok ? 'success' : 'failure',
              output: { title: ok ? 'Valid' : 'Invalid', summary: ok ? 'All commits follow conventional format' : 'Some commits do not follow format' }
            });

      - name: Run Biome Lint
        id: lint
        continue-on-error: true
        run: |
          set +e
          biome ci . --reporter=github 2>&1 | tee /tmp/biome-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Update Lint Check
        if: always() && steps.create-checks.outcome == 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const ok = '${{ steps.lint.outputs.exit_code }}' === '0';
            let annotations = [];
            let text = '';
            try {
              text = fs.readFileSync('/tmp/biome-output.txt', 'utf8').trim();
              // Parse GitHub workflow commands - fields can be in any order
              // Format: ::error file=path,line=N,endLine=N,col=N,endColumn=N,title=...::message
              const lineRegex = /^::(error|warning)\s+(.+)::(.+)$/gm;
              let match;
              while ((match = lineRegex.exec(text)) !== null && annotations.length < 50) {
                const level = match[1];
                const params = match[2];
                const message = match[3];
                // Parse key=value pairs (handles any order)
                const fields = {};
                for (const pair of params.split(',')) {
                  const idx = pair.indexOf('=');
                  if (idx > 0) {
                    fields[pair.slice(0, idx)] = pair.slice(idx + 1);
                  }
                }
                if (fields.file && fields.line) {
                  annotations.push({
                    path: fields.file,
                    start_line: parseInt(fields.line, 10),
                    end_line: fields.endLine ? parseInt(fields.endLine, 10) : parseInt(fields.line, 10),
                    start_column: fields.col ? parseInt(fields.col, 10) : undefined,
                    end_column: fields.endColumn ? parseInt(fields.endColumn, 10) : undefined,
                    annotation_level: level === 'error' ? 'failure' : 'warning',
                    message: message,
                    title: fields.title || 'Biome'
                  });
                }
              }
            } catch (e) {}
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo,
              check_run_id: process.env.LINT_CHECK_ID,
              status: 'completed', conclusion: ok ? 'success' : 'failure',
              output: {
                title: ok ? 'Passed' : `Failed (${annotations.length} issues)`,
                summary: ok ? 'All checks passed' : `Biome found ${annotations.length} issue(s)`,
                annotations: annotations.length > 0 ? annotations : undefined
              }
            });

      - name: Run Markdownlint
        id: markdownlint
        continue-on-error: true
        run: |
          set +e
          ${{ steps.pm.outputs.exec }} markdownlint-cli2 --config './lib/configs/.markdownlint-cli2.jsonc' 2>&1 | tee /tmp/markdownlint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Update Markdownlint Check
        if: always() && steps.create-checks.outcome == 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const ok = '${{ steps.markdownlint.outputs.exit_code }}' === '0';
            let annotations = [];
            try {
              const text = fs.readFileSync('/tmp/markdownlint-output.txt', 'utf8');
              const regex = /^([^:]+):(\d+)(?::(\d+))?\s+(error|warning)\s+(\S+)\s+(.+)$/gm;
              let match;
              while ((match = regex.exec(text)) !== null && annotations.length < 50) {
                annotations.push({
                  path: match[1],
                  start_line: parseInt(match[2], 10),
                  end_line: parseInt(match[2], 10),
                  start_column: match[3] ? parseInt(match[3], 10) : undefined,
                  annotation_level: match[4] === 'error' ? 'failure' : 'warning',
                  message: match[6],
                  title: match[5]
                });
              }
            } catch (e) {}
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo,
              check_run_id: process.env.MARKDOWNLINT_CHECK_ID,
              status: 'completed', conclusion: ok ? 'success' : 'failure',
              output: {
                title: ok ? 'Passed' : `Failed (${annotations.length} issues)`,
                summary: ok ? 'All markdown files valid' : `Found ${annotations.length} issue(s)`,
                annotations: annotations.length > 0 ? annotations : undefined
              }
            });

      # `$GITHUB_STEP_SUMMARY` is one append-only file shared by every step in
      # the job, so "what did the test run write" is a byte range, not a file
      # of its own. Record the length before the run and slice off whatever was
      # appended after it: the job summary still renders exactly as it did, and
      # the slice becomes the body of the Tests check run.
      #
      # Nothing here pipes the child's stdout. Vitest's github-actions reporter
      # emits `::error file=...` workflow commands that only become annotations
      # if the runner sees them on the step's own stdout, and a `| tee` also
      # flips the reporter's TTY detection. The lint steps can afford `tee`
      # because their output is parsed after the fact; this one cannot.
      - name: Run Tests
        id: test
        continue-on-error: true
        run: |
          set +e
          SUMMARY_BEFORE=0
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            SUMMARY_BEFORE=$(wc -c < "$GITHUB_STEP_SUMMARY" | tr -d ' ')
          fi
          ${{ steps.pm.outputs.name }} run ci:test
          TEST_EXIT=$?
          echo "exit_code=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          : > "$RUNNER_TEMP/test-summary.md"
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            tail -c "+$((SUMMARY_BEFORE + 1))" "$GITHUB_STEP_SUMMARY" > "$RUNNER_TEMP/test-summary.md"
          fi
          echo "Captured $(wc -c < "$RUNNER_TEMP/test-summary.md" | tr -d ' ') byte(s) of job summary from the test run"

      - name: Update Test Check
        if: always() && steps.create-checks.outcome == 'success'
        uses: actions/github-script@v9
        env:
          TEST_EXIT_CODE: ${{ steps.test.outputs.exit_code }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const ok = process.env.TEST_EXIT_CODE === '0';

            // Point the check's "Details" link at this job's page, which is
            // where GitHub renders the full step summary. The REST API has no
            // "which job am I" lookup, so match the job still executing on this
            // runner; the run URL is the fallback when that misses.
            let detailsUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, filter: 'latest', per_page: 100
              });
              const self = jobs.find((j) => j.status === 'in_progress' && j.runner_name === process.env.RUNNER_NAME);
              if (self && self.html_url) { detailsUrl = self.html_url; }
            } catch (e) {}

            // The checks API caps `output.text` at 65535 characters.
            const LIMIT = 65000;
            let text = '';
            try {
              text = fs.readFileSync(`${process.env.RUNNER_TEMP}/test-summary.md`, 'utf8').trim();
            } catch (e) {}
            if (text.length > LIMIT) {
              text = `${text.slice(0, LIMIT)}\n\n_Truncated. See the [full job summary](${detailsUrl})._`;
            }
            if (!text) {
              text = `The test run appended nothing to the job summary. See the [job log](${detailsUrl}).`;
            }

            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo,
              check_run_id: process.env.TEST_CHECK_ID,
              status: 'completed', conclusion: ok ? 'success' : 'failure',
              details_url: detailsUrl,
              output: {
                title: ok ? 'Passed' : 'Failed',
                summary: ok ? 'All tests passed' : 'Some tests failed',
                text
              }
            });

      # Discovery is deliberately `git ls-files` rather than a `bats --recursive`
      # walk or a `test:bats` script. Tracked-files-only excludes node_modules
      # for free, ls-files never descends into submodules, and it does not care
      # where a repository keeps its `__test__` directory -- the one thing that
      # varies most across consumers. The exclusions encode the house layout:
      # fixture trees hold `.bats` files that are inputs to a test, not suites.
      #
      # `glob` magic on every exclude is load-bearing. Without it git's `*` also
      # matches `/`, so a leading `**/` requires at least one directory before
      # the match and a ROOT-level `__fixtures__/` is not excluded at all.
      - name: Discover BATS suites
        id: bats-files
        run: |
          set -euo pipefail
          git ls-files -z -- '*.bats' \
            ':(exclude,glob)**/__fixtures__/**' \
            ':(exclude,glob)**/__test__/fixtures/**' \
            ':(exclude,glob)**/__test__/e2e/fixtures/**' \
            ':(exclude,glob)**/__test__/int/fixtures/**' \
            ':(exclude,glob).repos/**' \
            ':(exclude,glob)**/dist/**' \
            ':(exclude,glob)**/node_modules/**' > "$RUNNER_TEMP/bats-files.z"
          COUNT=$(tr -cd '\0' < "$RUNNER_TEMP/bats-files.z" | wc -c | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Discovered $COUNT BATS file(s)"
          tr '\0' '\n' < "$RUNNER_TEMP/bats-files.z"

      - name: Run BATS
        id: bats
        if: steps.bats-files.outputs.count != '0' && steps.runtime.outputs.bats-enabled == 'true'
        continue-on-error: true
        run: |
          set +e
          # bats exits with a usage dump if --output names a directory that does
          # not already exist.
          mkdir -p "$RUNNER_TEMP/bats-report"
          # Read into an array rather than piping through xargs: xargs may split
          # a long file list across several bats invocations, and each one would
          # overwrite report.xml, leaving only the final batch's results.
          #
          # A `while read -d ''` loop, not `mapfile -d ''`: macOS runners ship
          # bash 3.2, where mapfile does not exist (and -d needs bash 4.4 even
          # where it does). The final entry has no trailing NUL terminator only
          # if the list is malformed, so the `[ -n "$f" ]` guard catches the
          # last read returning non-zero with data still in $f.
          FILES=()
          while IFS= read -r -d '' f || [ -n "$f" ]; do
            FILES+=("$f")
          done < "$RUNNER_TEMP/bats-files.z"
          # --report-formatter, not --formatter: this writes report.xml for the
          # annotations while leaving human-readable TAP on the job log. Plain
          # `--formatter junit` would put the XML on stdout and nothing else.
          bats --report-formatter junit --output "$RUNNER_TEMP/bats-report" "${FILES[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Update Shell Tests Check
        if: always() && steps.create-checks.outcome == 'success'
        uses: actions/github-script@v9
        env:
          BATS_FILE_COUNT: ${{ steps.bats-files.outputs.count }}
          BATS_ENABLED: ${{ steps.runtime.outputs.bats-enabled }}
          BATS_EXIT_CODE: ${{ steps.bats.outputs.exit_code }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const count = parseInt(process.env.BATS_FILE_COUNT || '0', 10);
            const enabled = process.env.BATS_ENABLED === 'true';

            // Unescape XML entities. `&amp;` MUST be last so an escaped literal
            // like `&amp;lt;` is not double-decoded into `<`.
            const decode = (s) => s
              .replace(/&lt;/g, '<')
              .replace(/&gt;/g, '>')
              .replace(/&quot;/g, '"')
              .replace(/&#39;/g, "'")
              .replace(/&apos;/g, "'")
              .replace(/&amp;/g, '&');

            let result = { status: 'completed', conclusion: 'success', output: {} };

            if (count === 0) {
              result.output = { title: 'No shell tests', summary: 'No tracked `.bats` files were found, so there was nothing to run.' };
            } else if (!enabled) {
              // Suites exist but the toolchain is off -- either `bats: false` was
              // set explicitly or auto-detection missed them. Neutral rather than
              // failure: it does not block the PR, but it does not read as a
              // clean pass either, so the mismatch stays visible.
              result.conclusion = 'neutral';
              result.output = {
                title: 'BATS not provisioned',
                summary: `Found ${count} \`.bats\` file(s), but the BATS toolchain was not installed, so no shell tests ran.`
              };
            } else {
              const ok = process.env.BATS_EXIT_CODE === '0';
              const totals = { tests: 0, failures: 0, errors: 0, skipped: 0 };
              const annotations = [];
              try {
                const xml = fs.readFileSync(`${process.env.RUNNER_TEMP}/bats-report/report.xml`, 'utf8');

                const suiteRe = /<testsuite\s+([^>]*)>/g;
                let m;
                while ((m = suiteRe.exec(xml)) !== null) {
                  for (const key of Object.keys(totals)) {
                    const attr = new RegExp(`\\b${key}="(\\d+)"`).exec(m[1]);
                    if (attr) totals[key] += parseInt(attr[1], 10);
                  }
                }

                // Passing cases are self-closing; failed and skipped ones wrap a body.
                const caseRe = /<testcase\s+([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g;
                while ((m = caseRe.exec(xml)) !== null && annotations.length < 50) {
                  const body = m[2];
                  if (!body) continue;
                  const fail = /<(failure|error)\b[^>]*>([\s\S]*?)<\/\1>/.exec(body);
                  if (!fail) continue;

                  const nameAttr = /\bname="([^"]*)"/.exec(m[1]);
                  const message = decode(fail[2]).trim();

                  // `classname` carries only a basename, so the path has to come
                  // from the failure body. A failure raised inside a helper emits
                  // two frames across two lines -- `(from function 'f' in file
                  // helper.bash, line 2,\n in test file t.bats, line 4)` -- and the
                  // LAST `in test file` match is the test's own frame, which is the
                  // location worth annotating.
                  let path, line;
                  const refRe = /in test file ([^,]+), line (\d+)/g;
                  let ref;
                  while ((ref = refRe.exec(message)) !== null) {
                    path = ref[1].trim();
                    line = parseInt(ref[2], 10);
                  }
                  if (!path) continue;

                  annotations.push({
                    path,
                    start_line: line,
                    end_line: line,
                    annotation_level: 'failure',
                    message,
                    title: nameAttr ? decode(nameAttr[1]) : 'bats test'
                  });
                }
              } catch (e) {
                console.log(`Could not read the BATS junit report: ${e.message}`);
              }

              const failed = totals.failures + totals.errors;
              const skipNote = totals.skipped > 0 ? `, ${totals.skipped} skipped` : '';
              result.conclusion = ok ? 'success' : 'failure';
              if (totals.tests === 0) {
                // bats exited before writing a parseable report -- a suite that
                // failed to load, a missing helper, a crashed run. Reporting
                // "0 of 0" here would read as though nothing went wrong, so say
                // plainly that the report is the thing that is missing.
                result.output = ok
                  ? { title: 'No shell tests', summary: `Ran ${count} \`.bats\` file(s); the report contained no test cases.` }
                  : { title: 'Failed to run', summary: `BATS exited non-zero without producing a readable report. Check the job log for ${count} \`.bats\` file(s).` };
              } else {
                result.output = {
                  title: ok ? `Passed (${totals.tests} tests)` : `Failed (${failed} of ${totals.tests})`,
                  summary: ok
                    ? `All ${totals.tests} shell test(s) passed across ${count} file(s)${skipNote}.`
                    : `${failed} of ${totals.tests} shell test(s) failed across ${count} file(s)${skipNote}.`,
                  annotations: annotations.length > 0 ? annotations : undefined
                };
              }
            }

            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo,
              check_run_id: process.env.BATS_CHECK_ID,
              ...result
            });

      - name: Update check - Starting review
        if: steps.create-check.outputs.should-skip != 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            async function updateCheckWithRetry(updateParams, maxRetries = 5) {
              for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                  return await github.rest.checks.update(updateParams);
                } catch (error) {
                  const is500Error = error.status >= 500 && error.status < 600;
                  if (is500Error && attempt < maxRetries) {
                    const delayMs = Math.min(1000 * Math.pow(2, attempt - 1), 16000);
                    console.log(`Attempt ${attempt} failed with ${error.status}. Retrying in ${delayMs}ms...`);
                    await new Promise(resolve => setTimeout(resolve, delayMs));
                  } else {
                    throw error;
                  }
                }
              }
            }

            await updateCheckWithRetry({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: process.env.CHECK_RUN_ID,
              status: 'in_progress',
              output: {
                title: 'Reviewing code...',
                summary: 'Claude Code Review is analyzing the pull request changes.'
              }
            });

      - name: Find existing Claude review comment
        if: steps.create-check.outputs.should-skip != 'true'
        id: find-comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // Paginate: on a busy PR the sticky comment is often past the first
            // page of 30, and a miss here makes Claude think it is the first review.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });

            // Note: the comment MCP server strips HTML comments from posted
            // bodies, so a hidden `<!-- ... -->` marker can never appear in a
            // live comment. The visible `# Code Review` heading IS the marker.
            const botName = '${{ vars.APP_BOT_NAME }}';
            const matches = comments.filter(comment =>
              comment.user.login === botName &&
              comment.body.includes('# Code Review')
            );

            // Take the most recent match. Older ones are stale pre-sticky reviews;
            // minimizing the wrong one would hide the live comment.
            const claudeComment = matches.at(-1);

            if (claudeComment) {
              console.log(`Found existing Claude review comment: ${claudeComment.id}`);
              core.exportVariable('CLAUDE_COMMENT_ID', claudeComment.id);
            } else {
              console.log('No existing Claude review comment found');
              core.exportVariable('CLAUDE_COMMENT_ID', '0');
            }

      - name: Run Claude Code Review
        if: steps.create-check.outputs.should-skip != 'true'
        id: claude-review-action
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_PAT: ${{ secrets.CLAUDE_REVIEW_PAT }}
          CLAUDE_COMMENT_ID: ${{ env.CLAUDE_COMMENT_ID }}
          APP_BOT_NAME: ${{ vars.APP_BOT_NAME }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          bot_id: ${{ vars.APP_BOT_ID }}
          bot_name: ${{ vars.APP_BOT_NAME }}
          allowed_bots: ${{ inputs.claude-review-allowed-bots }}
          plugin_marketplaces: ${{ inputs.claude-review-plugin-marketplaces }}
          plugins: ${{ inputs.claude-review-plugins }}
          show_full_output: ${{ inputs.claude-debug }}
          exclude_comments_by_actor: "socket-security[bot]"
          use_sticky_comment: true
          claude_args: |
            --allowedTools "mcp__github__pull_request_read,mcp__github__get_pull_request,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_files,mcp__github__get_pull_request_status,mcp__github__get_pull_request_review_comments,mcp__github__list_commits,mcp__github__get_commit,mcp__github__get_issue_comments,mcp__github__add_comment_to_pending_review,mcp__github__pull_request_review_write,mcp__github__create_pending_pull_request_review,mcp__github__add_issue_comment,mcp__github_inline_comment__create_inline_comment,mcp__github_comment__update_claude_comment,mcp__github__get_job_logs,mcp__github__submit_pending_pull_request_review,Bash(gh:*),Bash(git:*),Bash(jq:*),Bash(cat:*),Bash(echo:*),Bash(bash .github/scripts/gh-pr-review.sh:*),Read,Glob,Grep,Write(/tmp/**),Skill"
            --disallowedTools "Agent,Task"
            --model "claude-opus-4-8"
          prompt: |
            # Pull Request Context

            **Repository:** ${{ github.repository }}
            **PR Number:** ${{ github.event.pull_request.number }}
            **PR Title:** ${{ github.event.pull_request.title }}
            **Base Branch:** ${{ github.base_ref }}
            **Head Branch:** ${{ github.head_ref }}
            **Current Commit:** ${{ github.event.pull_request.head.sha }}
            **PR Description:**
            ${{ github.head_ref == 'changeset-release/main' && '(Skipped - auto-generated changelog for release PR)' || github.event.pull_request.body }}

            ---

            # Your Mission

            You are an expert code reviewer for this repository. Review the PR changes thoughtfully and help improve code quality through constructive feedback.

            **The PR branch is already checked out** in the current working directory.

            ---

            # Step 1: Gather Context

            ## Available Tools

            **MCP Tools** (preferred for data access):
            - Use these for reading PR data, commits, comments, etc.
            - More reliable than CLI parsing
            - Structured JSON responses
            - MCP tools use the GitHub App token which has full permissions
            - **Exception:** For check runs, use `gh api` (see section 1.3) - the MCP `get_status` method queries the legacy status API which is empty

            **Helper Script** (.github/scripts/gh-pr-review.sh):
            - A single consolidated script with subcommands for review-management operations
            - Call via bash interpreter (the script is not executable):
              - `bash .github/scripts/gh-pr-review.sh resolve-thread <comment_id> <pr_number> <commit_sha>` - Reply to a review-comment thread and mark it resolved (COMMONLY USED)
              - `bash .github/scripts/gh-pr-review.sh minimize-comment <comment_id>` - Minimize a single old comment as OUTDATED (RARELY NEEDED - sticky comments auto-update)
              - `bash .github/scripts/gh-pr-review.sh minimize-old-summaries <pr_number> <current_sha>` - Minimize old bot review-summary comments, excluding the sticky comment and any that mention the current SHA (RARELY NEEDED)
              - `bash .github/scripts/gh-pr-review.sh check-status <commit_sha>` - Print the filtered validation check-run status for a commit (see section 1.3)
              - `bash .github/scripts/gh-pr-review.sh approve-pr <pr_number> <commit_sha> [body]` - Submit a formal APPROVE review (see "Approving the PR" in Step 4; use ONLY when the PR is clean)
            - Repo owner/name are read automatically from `GITHUB_REPOSITORY`; do not pass them.
            - Use when MCP tools + simple bash can't accomplish the task
            - **Note:** With sticky comments enabled, you rarely need to minimize anything

            **Plugin Skills** (via the `Skill` tool):
            - The `design-docs` plugin is installed, exposing skills like
              `design-search`, `design-index`, `design-link`, `plan-explore`, and
              `plan-list`. Use them to pull *context* about the repo's design and
              plans while reviewing (see section 1.7). Other repos may install
              additional plugins; use whatever skills are available when relevant.

            ---

            Use MCP tools for structured data access (preferred over bash):

            ## 1.1 Get PR Details
            ```
            mcp__github__pull_request_read(
              method: "get",
              owner: "${{ github.repository_owner }}",
              repo: "${{ github.event.repository.name }}",
              pullNumber: ${{ github.event.pull_request.number }}
            )
            ```

            ## 1.2 Get Changed Files
            ```
            mcp__github__pull_request_read(
              method: "get_files",
              owner: "${{ github.repository_owner }}",
              repo: "${{ github.event.repository.name }}",
              pullNumber: ${{ github.event.pull_request.number }}
            )
            ```

            **Note on large responses:** If MCP tools return errors about response size (>25000 tokens), use alternative approaches:
            - For large file lists: Use `gh api` piped to `jq` to filter fields (avoid `--jq` flag due to shell escaping issues)
            - For large comment threads: Use `gh api` with pagination (`--paginate`) piped to `jq` for filtering
            - For file diffs: Use `mcp__github__get_pull_request_diff` or `git diff` commands instead

            ## 1.3 Check Validation Results
            All validation checks have already run before this review. Check their status by filtering to only the checks we care about:

            ```bash
            bash .github/scripts/gh-pr-review.sh check-status ${{ github.event.pull_request.head.sha }}
            ```

            This wraps the `gh api ... | jq ...` pipe in a single allowlisted command so the bash policy doesn't reject it, and filters to only the validation checks we care about:
              - **PR Title Validation** - Ensures PR title follows conventional commits
              - **Conventional Commits** - Validates all commit messages
              - **Code Quality** - Biome linting and formatting
              - **Markdown** - Markdown linting
              - **Tests** - Full test suite execution

            Excludes irrelevant checks like "Validation" (orchestration), "Cleanup", and "Claude Code Review" itself.

            **Note:** Do NOT use `mcp__github__pull_request_read(method: "get_status")` - it queries the legacy status API which is empty. This repository uses the modern check runs API.

            **Important:**
            - Checks can pass (success), fail (failure), or be skipped (neutral) - all are valid outcomes
            - Report the status of each check regardless of conclusion
            - If any checks are still running (status: "in_progress"), note that in your review
            - Consider validation results when prioritizing review feedback

            ## 1.4 Get Existing Review Comments
            ```
            mcp__github__pull_request_read(
              method: "get_review_comments",
              owner: "${{ github.repository_owner }}",
              repo: "${{ github.event.repository.name }}",
              pullNumber: ${{ github.event.pull_request.number }}
            )
            ```
            Filter for your comments (author.login == "${{ vars.APP_BOT_NAME }}").
            Also note any open threads authored by `copilot[bot]` - you are
            expected to resolve those too once their issues are fixed (see Step 2).

            ## 1.5 Get Previous Top-Level Comments
            ```
            mcp__github__get_issue_comments(
              owner: "${{ github.repository_owner }}",
              repo: "${{ github.event.repository.name }}",
              issue_number: ${{ github.event.pull_request.number }}
            )
            ```
            Filter for your comments (user.login == "${{ vars.APP_BOT_NAME }}")

            ## 1.6 Detect Force-Pushes

            **Method 1: Using MCP tools (preferred)**
            ```
            mcp__github__list_commits(
              owner: "${{ github.repository_owner }}",
              repo: "${{ github.event.repository.name }}",
              sha: "${{ github.head_ref }}"
            )

            mcp__github__get_commit(
              owner: "${{ github.repository_owner }}",
              repo: "${{ github.event.repository.name }}",
              sha: "commit-sha-from-previous-review"
            )
            ```

            **Method 2: Using git (fallback)**
            ```bash
            git log --all --oneline -30
            ```

            **Detection logic:**
            - Look for your previous review comments that mention specific commit SHAs
            - Try to fetch those commits using `mcp__github__get_commit`
            - If commits return 404 → force-push occurred, inline comments are orphaned

            ## 1.7 Design Docs and Plans (context only)

            This repo may ship design documentation under `.claude/design/` and
            implementation plans under `.claude/plans/`. The `design-docs` plugin
            is installed - use its skills (via the `Skill` tool) to pull *context*
            on why the code is shaped the way it is:

            - `design-search` - full-text search across design docs for a topic or decision
            - `design-index` / `design-link` - find which doc covers an area and how docs relate
            - `plan-explore` / `plan-list` - see active implementation plans

            Use these to inform your review - for example, to check whether a change
            aligns with a documented decision, or to understand intent before
            flagging something as wrong. **This is the ONLY way you should touch
            those files.** Do NOT review, diff, or comment on the design and plan
            files themselves - they remain out of scope (see Step 3). Treat them as
            reference material, not as changes to critique.

            ---

            # Step 2: Determine Review Strategy

            ## If Force-Push Detected:

            **DO NOT create multiple new reviews.** Instead:

            1. **Update your existing sticky comment** (if one exists) using `mcp__github_comment__update_claude_comment`
            2. In the updated comment:
               - State: "🔄 Branch was force-pushed (previous review at commit [old-sha], now at ${{ github.event.pull_request.head.sha }})"
               - Note: "Previous inline comments are orphaned and can be ignored"
               - Provide a fresh, comprehensive review of the current state
            3. Only create NEW inline comments for issues in the current code
            4. Do NOT reference or try to update orphaned inline comments

            ## If No Force-Push (Normal Update):

            ### For Previously Reported Issues:

            Check if your inline comments are still relevant by:
            1. Reading the file at the line mentioned in your comment
            2. Checking if the issue still exists

            **If fixed:** Reply to the existing review comment thread and mark as resolved:

            ```bash
            bash .github/scripts/gh-pr-review.sh resolve-thread <comment_id> ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
            ```

            Replace `<comment_id>` with the actual numeric comment ID from the review comment.

            **If still broken:** Reply to the existing thread (do not mark as resolved):
            ```bash
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments/<comment_id>/replies \
              -f body="⚠️ This issue persists at commit ${{ github.event.pull_request.head.sha }}."
            ```

            Replace `<comment_id>` with the actual numeric comment ID.

            ### For Copilot's Comments:

            GitHub Copilot sometimes leaves its own review comments on the PR.
            Treat open `copilot[bot]` threads the same way you treat your own:

            1. Read the file at the line Copilot flagged and check whether a later
               push has fixed the issue.
            2. **If fixed:** resolve the thread with the same command, using
               Copilot's comment ID:

               ```bash
               bash .github/scripts/gh-pr-review.sh resolve-thread <copilot_comment_id> ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
               ```

            3. **If still unaddressed:** leave it alone. Do not resolve a Copilot
               thread whose issue still stands, and do not re-litigate a valid
               Copilot point - if you agree and it's unfixed, you may reinforce it
               in your summary.

            ### For New Issues:
            - Create pending review first: `mcp__github__pull_request_review_write(method: "create", event: omitted for pending)`
            - Add inline comments using `mcp__github__add_comment_to_pending_review`:
              ```
              mcp__github__add_comment_to_pending_review(
                owner: "${{ github.repository_owner }}",
                repo: "${{ github.event.repository.name }}",
                pullNumber: ${{ github.event.pull_request.number }},
                path: "path/to/file.ts",
                body: "Your comment here",
                line: 42,
                subjectType: "LINE"  // REQUIRED: "LINE" for line comments, "FILE" for file-level comments
              )
              ```
            - Submit review when done: `mcp__github__pull_request_review_write(method: "submit_pending")`

            ### Manage Summary Comments:

            **IMPORTANT - Sticky Comment Feature:**
            - This workflow uses sticky comments - your main review comment is automatically updated in place
            - The sticky comment ID for this PR is `${{ env.CLAUDE_COMMENT_ID }}` (`0` means this is the first review).
              The value is inlined here - do NOT try to read `$CLAUDE_COMMENT_ID` from the shell, that command will be denied.
            - **CRITICAL:** Your main review comment MUST start with the `# Code Review` heading and MUST contain the exact line shown in the format below, with the full 40-character commit SHA in backticks. A follow-up verification step greps the posted comment for both; a comment missing either fails the build.
            - **Do NOT use HTML comments** (`<!-- ... -->`) as markers - the comment server strips them from the posted body, so they can never be matched later.
            - **DO NOT minimize the sticky comment** - it will be updated automatically
            - Only minimize OTHER old review comments (e.g., from before sticky comments were enabled)

            **Main review comment format (copy the first three lines exactly):**
            ```markdown
            # Code Review

            **Current Commit:** `${{ github.event.pull_request.head.sha }}`

            ## Summary
            ...your review content...
            ```

            **If you need to minimize old non-sticky comments (RARE):**

            ```bash
            bash .github/scripts/gh-pr-review.sh minimize-old-summaries ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
            ```

            This automatically excludes the sticky comment (ID: ${{ env.CLAUDE_COMMENT_ID }}) and minimizes only old review comments.

            **In most cases, you should NOT need to minimize anything** - just update the sticky comment.

            **Only post new summary when:**
            - Significant new changes warrant fresh analysis
            - All previous issues are resolved (final approval)
            - This is your first review of this PR
            - Force-push occurred (major rewrite)

            ---

            # Step 3: What to Review

            ## Out of Scope - Do NOT Review

            Some changed files are not worth reviewing. Skip them entirely - do not
            comment on their contents, style, or formatting:

            - **Build artifacts in any `dist/` directory.** Generated output is
              sometimes committed deliberately (e.g. a bundled GitHub Action that
              runs from `dist/`). Treat any path containing a `dist/` segment as
              generated; do not flag it. If a `dist/` change looks wrong, comment
              on the *source* that produces it, not the artifact.
            - **Local agent working directories**, if present:
              `.claude/design/`, `.claude/specs/`, `.claude/plans/`, and
              `.claude/notes/`. These hold design notes, specs, plans, and scratch
              docs - not shippable code. Skip changes confined to these paths.
            - **Lockfiles and generated changelogs.** Don't review churn in
              `pnpm-lock.yaml`, `package-lock.json`, `yarn.lock`, `bun.lockb`, or
              `CHANGELOG.md` - these are tool-generated. Discuss a dependency
              change only via the `package.json` manifest edit that caused it,
              never the lockfile diff.

            Still *count* these files when reasoning about the PR's scope, but spend
            your review effort on the source and product code.

            ## Code Quality
            - Follow existing patterns in the codebase
            - Check for proper types (avoid `any` usage where possible)
            - Verify naming conventions are consistent
            - Look for code duplication or refactoring opportunities

            ## Correctness & Safety
            - Logic errors or edge cases
            - Error handling
            - Security concerns
            - Performance issues

            ## Testing
            - Test coverage for new code
            - Test quality and edge cases

            ## Positive Observations
            - Acknowledge well-written code
            - Note good practices being followed
            - Celebrate improvements

            **Be constructive:** Suggest improvements, not just problems. Explain "why" behind suggestions.

            ---

            # Step 4: Post Your Review

            ## Workflow:

            1. **Check for existing review comments** from you
            2. **Check for force-push** (compare commit SHAs)
            3. **If force-push detected:**
               - Your sticky comment will be automatically updated in place
               - Don't try to update orphaned inline comments
            4. **If normal update:**
               - **Reply to and resolve** inline comment threads when issues are fixed
               - Reply to threads that still have issues (do not mark as resolved)
               - Create new inline comments for new issues
               - Your main review comment will be automatically updated via sticky comment feature
            5. **Use structured review workflow:**
               - Create pending review
               - Add all inline comments
               - Submit review with summary
            6. **If you hit tool or permission limits:**
               - Permission errors (file access, tool execution, etc.)
               - Tool failures (MCP tools, gh CLI, helper scripts)
               - API errors or rate limits
               - A tool or permission you do NOT have but believe you need to
                 review effectively (e.g. a denied command, a missing MCP method,
                 or read access you lack)
               - **Include a note in your review** describing what failed or what
                 you were missing, so a human can investigate and grant or fix it
            7. **Consider approval:** If the PR is clean, submit a formal approval
               (see "Approving the PR" below). When it isn't, post your summary
               without approving.

            ## Approving the PR

            When the PR is in a clean state, submit a formal GitHub approval so
            maintainers get an unambiguous signal. Approve ONLY when ALL hold:

            - Every issue you previously reported is resolved (threads replied to
              and marked resolved).
            - You have no new issues to report on the current commit. Purely
              positive feedback or minor, non-actionable nits are fine; an open
              actionable problem is not.
            - The validation checks (section 1.3) are passing or neutrally skipped.
              Never approve when any check has a `failure` conclusion, or while
              checks are still `in_progress`.

            If every condition holds:

            ```bash
            bash .github/scripts/gh-pr-review.sh approve-pr ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}
            ```

            Do NOT approve when:
            - Any actionable issue remains open - post your summary without approving.
            - This PR was opened by the review bot itself (`${{ vars.APP_BOT_NAME }}`) - maintainers will handle it.;
              GitHub rejects self-approval, so just post your summary.
            - You are unsure. Withholding approval is always the safe default.

            ## Comment Quality Rules

            1. **Always verify current commit SHA** before posting
            2. **Reply to and resolve threads when fixed** - Confirm fixes with a reply and mark the thread as resolved
            3. **DON'T minimize the sticky comment** - It auto-updates in place (only minimize old non-sticky comments if needed)
            4. **Use MCP tools** for creating/updating comments (preferred)
            5. **Fall back to `gh api`** for replying to threads
            6. **Be efficient** - one clear comment beats many scattered ones
            7. **Be kind** - focus on the code, not the person
            8. **Track commit SHAs** - mention current SHA in your summary for force-push detection
            9. **Report tool/permission gaps** - If you hit permission errors, tool failures, or script errors during the review - OR if you lack a tool or permission you believe you need to review effectively - mention it in your review comment so maintainers are aware and can resolve it

            ---

            # Final Notes

            - **Current commit being reviewed:** ${{ github.event.pull_request.head.sha }}
            - **Always include the full SHA** in your summary comment, using the
              Current Commit line from the format template above - the post-review
              verification step fails the build if the posted comment lacks the
              `# Code Review` heading or this SHA
            - **Sticky comment feature is enabled** - your main review comment updates automatically
            - **Don't minimize the sticky comment (ID: ${{ env.CLAUDE_COMMENT_ID }})** - only minimize other old comments if absolutely necessary

            ## Critical Behaviors for Clean Review History:

            1. **Reply to and resolve fixed inline comments** - Confirm fixes with clear replies and mark threads as resolved
            2. **Use the sticky comment** - Your main review updates automatically, don't create duplicates
            3. **Avoid review spam** - PR conversations should be clean and easy to follow

            ## Execution Environment - READ THIS

            You are running **non-interactively** inside a GitHub Actions job. There is
            no user, and **there is no next turn**. When you end your turn, the process
            is killed immediately and anything you have not already written is lost.

            - **NEVER end your turn to wait for something.** No background work, no
              "I'll pause for notifications", no "waiting for results". Nothing will
              ever arrive. If you stop, the review is silently lost and the job still
              reports success.
            - **Do all work inline, in this session.** Subagent dispatch is disabled.
            - **Posting is the last thing you do.** Before you finish, you MUST have
              called `mcp__github_comment__update_claude_comment` with your complete
              review, starting with the `# Code Review` heading and containing the
              Current Commit line with the full SHA. A follow-up verification step
              greps the posted comment for exactly those two things and fails the
              build if either is missing - ending your turn without that call, or
              posting a comment without them, is a failed review.
            - If you run low on budget or context, **post what you have immediately**
              with a note about what you did not get to. A partial posted review beats
              a complete unposted one.

            **Bash allowlist:** commands are matched against fixed prefixes. Anything
            containing command substitution (`$(...)`), variable expansion (`$VAR`),
            loops, or `;` chaining will be **denied**. Write plain, single-purpose
            commands with literal arguments, and run them one at a time.

      - name: Verify a review was actually posted
        if: steps.create-check.outputs.should-skip != 'true' && steps.claude-review-action.outcome == 'success'
        id: verify-review
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            // The action exits 0 even when the review session ends without posting
            // anything (e.g. it ended its turn waiting on background work). Without
            // this guard that failure mode is invisible: green job, no review.
            //
            // Match the visible contract the prompt mandates: the `# Code Review`
            // heading plus this run's head SHA. Do NOT match on an HTML comment
            // marker - the comment MCP server strips `<!-- ... -->` from posted
            // bodies, so a hidden marker never survives to the live comment and
            // requiring one fails every successful review.
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.substring(0, 7);
            const botName = '${{ vars.APP_BOT_NAME }}';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100
            });

            const candidates = comments.filter(comment =>
              comment.user.login === botName &&
              comment.body.includes('# Code Review')
            );

            const posted = candidates.some(comment =>
              comment.body.includes(sha) || comment.body.includes(shortSha)
            );

            if (!posted) {
              const detail = candidates.length > 0
                ? `A review comment exists but does not mention ${shortSha} - the session likely reviewed a stale commit or omitted the Current Commit line.`
                : `The session most likely ended without calling mcp__github_comment__update_claude_comment.`;
              core.setFailed(
                `Claude Code Review exited successfully but posted no review comment for ${shortSha}. ` +
                detail + ' ' +
                `Check the "Run Claude Code Review" step output for the final result message, then re-run this job.`
              );
              return;
            }

            console.log(`Review comment for ${shortSha} confirmed.`);

      - name: Complete check - Review completed
        if: always() && steps.create-check.outcome == 'success' && steps.create-check.outputs.should-skip != 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            async function updateCheckWithRetry(updateParams, maxRetries = 5) {
              for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                  return await github.rest.checks.update(updateParams);
                } catch (error) {
                  const is500Error = error.status >= 500 && error.status < 600;
                  if (is500Error && attempt < maxRetries) {
                    const delayMs = Math.min(1000 * Math.pow(2, attempt - 1), 16000);
                    console.log(`Attempt ${attempt} failed with ${error.status}. Retrying in ${delayMs}ms...`);
                    await new Promise(resolve => setTimeout(resolve, delayMs));
                  } else {
                    throw error;
                  }
                }
              }
            }

            const checkRunId = process.env.CHECK_RUN_ID;
            const reviewResult = '${{ steps.claude-review-action.outcome }}';
            // 'failure' here means the action succeeded but posted nothing.
            const verifyResult = '${{ steps.verify-review.outcome }}';

            const notPosted = verifyResult === 'failure';
            // 'skipped' means an earlier step hard-failed the job before the
            // review ran - close the queued check honestly rather than strand it.
            const conclusion = (reviewResult === 'failure' || notPosted) ? 'failure' :
                              reviewResult === 'success' ? 'success' :
                              'neutral';

            const title = notPosted ? 'Review produced no comment' :
                         reviewResult === 'failure' ? 'Review failed' :
                         reviewResult === 'success' ? 'Review completed' :
                         reviewResult === 'skipped' ? 'Review did not run' :
                         'Review completed with warnings';

            const summary = notPosted
              ? 'Claude Code Review ran to completion but never posted a review comment for this commit. This is a review failure, not a code failure - re-run the job.'
              : reviewResult === 'skipped'
                ? 'The validation job failed before the review step could run.'
                : 'Claude Code Review has completed. Check the pull request comments for detailed feedback.';

            await updateCheckWithRetry({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkRunId,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: title,
                summary: summary
              }
            });

  cleanup:
    name: Cleanup
    needs: [validate]
    runs-on: ${{ inputs.runner }}
    if: always()
    permissions:
      checks: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Cleanup in-progress checks
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            async function updateCheckWithRetry(updateParams, maxRetries = 5) {
              for (let attempt = 1; attempt <= maxRetries; attempt++) {
                try {
                  return await github.rest.checks.update(updateParams);
                } catch (error) {
                  const is500Error = error.status >= 500 && error.status < 600;
                  if (is500Error && attempt < maxRetries) {
                    const delayMs = Math.min(1000 * Math.pow(2, attempt - 1), 16000);
                    console.log(`Attempt ${attempt} failed with ${error.status}. Retrying in ${delayMs}ms...`);
                    await new Promise(resolve => setTimeout(resolve, delayMs));
                  } else {
                    throw error;
                  }
                }
              }
            }

            const names = ['PR Title Validation', 'Conventional Commits', 'Code Quality', 'Markdown', 'Tests', 'Shell Tests', 'Claude Code Review'];
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });

            // 'queued' included: the Claude Code Review check is now created
            // early (queued) and would be stranded if the run is cancelled
            // before the review steps execute.
            const inProgressChecks = data.check_runs.filter(x => names.includes(x.name) && (x.status === 'in_progress' || x.status === 'queued'));

            if (inProgressChecks.length === 0) {
              console.log('No in-progress checks to clean up');
              return;
            }

            console.log(`Found ${inProgressChecks.length} in-progress check(s) to clean up`);

            for (const c of inProgressChecks) {
              console.log(`Resolving check: ${c.name} (ID: ${c.id})`);
              await updateCheckWithRetry({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: c.id,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: 'Workflow cancelled',
                  summary: 'This check was cancelled because a newer workflow run was triggered or the workflow was manually cancelled.'
                }
              });
            }

            console.log('All in-progress checks resolved as neutral');
